<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تشريح السيارة 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>

<body>
<style>
/* Layout: full-bleed 3D stage; parts index docked at the start (right, RTL), spec card floating at the end; both become sheets on phones. */
:root {
  --bg: #E4E9EE;
  --scene-1: #EEF2F5;
  --scene-2: #D3DBE3;
  --panel: rgba(248, 250, 252, 0.9);
  --panel-solid: #F6F8FA;
  --ink: #0F1A24;
  --ink-2: #4A5A6A;
  --line: #C6D0DA;
  --chip: #E2E8EE;
  --accent: #C9450F;
  --accent-ink: #FFFFFF;
  --grid: #A9B6C3;
  --xray: #2F6CC9;
  --sev1: #2C8653;
  --sev2: #A86F12;
  --sev3: #C2302F;
  --shadow: 0 10px 30px rgba(15, 26, 36, 0.12);
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091017; --scene-1: #111C26; --scene-2: #070C11; --panel: rgba(15, 23, 31, 0.9); --panel-solid: #0F171F;
    --ink: #E4ECF2; --ink-2: #93A5B6; --line: #233343; --chip: #182533;
    --accent: #FF7B3F; --accent-ink: #1C0C03; --grid: #22323F; --xray: #7DB0FF;
    --sev1: #4CC27E; --sev2: #E9B33C; --sev3: #FF6666; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091017; --scene-1: #111C26; --scene-2: #070C11; --panel: rgba(15, 23, 31, 0.9); --panel-solid: #0F171F;
  --ink: #E4ECF2; --ink-2: #93A5B6; --line: #233343; --chip: #182533;
  --accent: #FF7B3F; --accent-ink: #1C0C03; --grid: #22323F; --xray: #7DB0FF;
  --sev1: #4CC27E; --sev2: #E9B33C; --sev3: #FF6666; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, var(--scene-1), var(--scene-2)); }
#c { display: block; width: 100%; height: 100%; touch-action: none; }

#ui {
  position: absolute; inset: 0; pointer-events: none;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#ui > * , .main > * { pointer-events: auto; }
.main { pointer-events: none; display: grid; grid-template-columns: 290px minmax(0, 1fr) 360px; gap: 12px; min-height: 0; }

.surface { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-inline-end: auto; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0; line-height: 1.2; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 5px 11px; border-radius: 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#listToggle { display: none; }

/* parts index */
#index { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.index-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.index-head h2 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.index-head h2 small { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-weight: 400; }
#q { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 14px; }
#q::placeholder { color: var(--ink-2); }
#list { overflow-y: auto; padding: 0 6px 12px; min-height: 0; overscroll-behavior: contain; }
.grp { margin-top: 6px; }
.grp-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--panel-solid); text-transform: uppercase; letter-spacing: .04em; }
.grp-h .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.grp-h .en { font-family: var(--font-mono); font-weight: 400; margin-inline-start: auto; font-size: 11px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; width: 100%; text-align: start; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.item[aria-current="true"] .en { color: inherit; opacity: .85; }
.item .ar { font-size: 14px; overflow-wrap: anywhere; }
.item .en { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); direction: ltr; text-align: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.empty { padding: 16px 10px; color: var(--ink-2); font-size: 13px; }
.more { margin: 14px 8px 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
.more b { color: var(--ink); font-weight: 600; }
.more a { color: var(--accent); text-decoration: none; }
.more a:hover { text-decoration: underline; }

/* spec card */
#card { grid-column: 3; align-self: start; max-height: 100%; overflow-y: auto; padding: 16px; display: grid; gap: 12px; overscroll-behavior: contain; }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sys-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--ink); }
.sys-chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); direction: ltr; }
#cardClose { margin-inline-start: auto; border: 0; background: transparent; padding: 2px 6px; font-size: 18px; line-height: 1; color: var(--ink-2); display: none; }
.name h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.25; text-wrap: balance; }
.en-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.en-name { font-family: var(--font-mono); font-size: 14px; direction: ltr; color: var(--ink); background: var(--chip); padding: 2px 8px; border-radius: 6px; }
.say { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 3px 7px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); }
.say svg { width: 14px; height: 14px; }
.where { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
.where svg { width: 14px; height: 14px; flex: none; margin-top: 4px; }
.blk { display: grid; gap: 4px; }
.blk h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; }
.blk p { margin: 0; font-size: 15px; }
.sev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); border-inline-start: 4px solid var(--sev-c, var(--line)); }
.sev b { font-size: 14px; color: var(--sev-c); }
.sev span { font-size: 13px; color: var(--ink-2); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--sev-c); }
.note { font-size: 13.5px; background: var(--chip); border-radius: 10px; padding: 9px 12px; }
.note b { font-weight: 600; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card-actions .grow { margin-inline-start: auto; display: inline-flex; gap: 6px; }

/* footer hint + tooltip + loader */
.foot { justify-self: center; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.hint { font-size: 12.5px; color: var(--ink-2); padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.legend { display: inline-flex; gap: 10px; font-size: 12px; color: var(--ink-2); padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); flex-wrap: wrap; justify-content: center; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
#tip { position: fixed; z-index: 30; pointer-events: none; padding: 5px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .12s; }
#tip .en { font-family: var(--font-mono); font-size: 11px; opacity: .75; margin-inline-start: 6px; }
#loader { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 40; transition: opacity .4s; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#loader p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; }
#loader .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); margin: 0 auto; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 1100px) {
  .main { grid-template-columns: 260px minmax(0, 1fr) 320px; }
}
@media (max-width: 860px) {
  #ui { gap: 8px; padding-block: 8px; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #listToggle { display: inline-flex; }
  #index { position: absolute; z-index: 25; top: 8px; bottom: 8px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100% - 32px)); transform: translateX(calc(100% + 40px)); transition: transform .25s ease; }
  #index.open { transform: none; }
  #card { grid-column: 1; grid-row: 2; align-self: end; max-height: 48vh; padding: 12px 14px; gap: 10px; }
  #card.collapsed > :not(.card-top):not(.name) { display: none; }
  #card.collapsed .en-row { display: none; }
  #card.collapsed .name h2 { font-size: 18px; }
  #cardClose { display: inline-block; }
  .name h2 { font-size: 21px; }
  .brand h1 { font-size: 17px; }
  .brand p { display: none; }
  .legend { display: none; }
  .hint { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #index, #tip, #loader { transition: none; }
  #loader .spin { animation: none; }
}
</style>

<div id="app" dir="rtl" lang="ar">
  <div id="stage"><canvas id="c" aria-label="مجسم سيارة ثلاثي الأبعاد. اسحب لتلف السيارة واكبس على أي قطعة لتشوف شرحها."></canvas></div>

  <div id="ui">
    <header class="bar surface">
      <div class="brand">
        <h1>تشريح <span>السيارة</span></h1>
        <p>سيدان على طراز BMW · اكبس على أي قطعة</p>
      </div>
      <div class="controls">
        <button class="btn" id="listToggle" aria-expanded="false" aria-controls="index">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          القطع
        </button>
        <div class="seg" role="group" aria-label="شكل الهيكل">
          <button data-mode="xray" aria-pressed="true">شفّاف</button>
          <button data-mode="solid" aria-pressed="false">كامل</button>
          <button data-mode="hidden" aria-pressed="false">بدون هيكل</button>
        </div>
        <button class="btn" id="runBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span>شغّل المحرك</span>
        </button>
        <div class="seg" role="group" aria-label="زاوية الكاميرا">
          <button data-view="iso" aria-pressed="false">٣/٤</button>
          <button data-view="side" aria-pressed="false">جنب</button>
          <button data-view="top" aria-pressed="false">فوق</button>
          <button data-view="under" aria-pressed="false">تحت</button>
        </div>
      </div>
    </header>

    <div class="main">
      <aside id="index" class="surface" aria-label="قائمة قطع السيارة">
        <div class="index-head">
          <h2>كل القطع <small id="count"></small></h2>
          <input id="q" type="search" placeholder="دوّر: تيربو، brake، رديتر…" autocomplete="off" aria-label="دوّر على قطعة">
        </div>
        <div id="list"></div>
      </aside>
      <div></div>
      <section id="card" class="surface" aria-live="polite"></section>
    </div>

    <div class="foot">
      <div class="hint" id="hint">اسحب لتلف · قرّب بالعجلة أو بإصبعين · اكبس على أي قطعة</div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div id="tip" role="tooltip"></div>
  <div id="loader"><div><div class="spin"></div><p id="loaderMsg">عم يجهّز المجسّم…</p></div></div>
</div>

<script>
  // If the 3D library cannot load, say so instead of spinning forever.
  setTimeout(function () {
    if (!window.__carReady) {
      var m = document.getElementById('loaderMsg');
      if (m) m.textContent = 'ما قدرت حمّل مكتبة الـ3D. جرّب تحدّث الصفحة أو افتحها بمتصفح تاني.';
    }
  }, 12000);
</script>

const listEl = $('#list'), cardEl = $('#card'), tipEl = $('#tip'), qEl = $('#q'), indexEl = $('#index');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
$('#count').textContent = PARTS.length + ' قطعة';
$('#legend').innerHTML = ['engine', 'drivetrain', 'brakes', 'suspension', 'electrical', 'cooling'].map(k => `<span><i style="background:${SYS[k].color}"></i>${SYS[k].ar}</span>`).join('') + '<span>…</span>';

function renderList() {
  const q = norm(qEl.value.trim());
  let html = '', any = false;
  for (const k of ORDER) {
    const items = PARTS.filter(p => p.sys === k && (!q || norm(p.ar + ' ' + p.en + ' ' + p.code).includes(q)));
    if (!items.length) continue; any = true;
    html += `<div class="grp"><div class="grp-h"><span class="dot" style="background:${SYS[k].color}"></span>${SYS[k].ar}<span class="en">${SYS[k].en}</span></div>`;
    html += items.map(p => `<button class="item" data-id="${p.id}" aria-current="${p === state.sel}"><span class="ar">${esc(p.ar)}</span><span class="en">${esc(p.en)}</span></button>`).join('');
    html += '</div>';
  }
  if (!q) html += `<div class="more"><b>بدك تتعمّق أكتر؟</b>
    <a href="https://www.howacarworks.com/" target="_blank" rel="noopener">How a Car Works: شروحات مصوّرة لكل أنظمة السيارة (إنجليزي)</a>
    <a href="https://animagraffs.com/how-a-car-engine-works/" target="_blank" rel="noopener">Animagraffs: كيف بيشتغل المحرك، مع رسوم متحركة (إنجليزي)</a></div>`;
  listEl.innerHTML = any ? html : '<div class="empty">ما في قطعة بهالاسم. جرّب كلمة تانية، بالعربي أو بالإنجليزي.</div>';
}
const canSpeak = 'speechSynthesis' in window;
function renderCard() {
  const p = state.sel;
  if (!p) { cardEl.hidden = true; requestAnimationFrame(updateOffset); return; }
  cardEl.hidden = false;
  const sv = SEV[p.sev], sys = SYS[p.sys];
  cardEl.innerHTML = `
    <div class="card-top">
      <span class="sys-chip"><i style="background:${sys.color}"></i>${sys.ar}</span>
      <span class="code">${p.code}</span>
      <button id="cardClose" aria-label="صغّر البطاقة">${cardEl.classList.contains('collapsed') ? '▴' : '▾'}</button>
    </div>
    <div class="name">
      <h2>${esc(p.ar)}</h2>
      <div class="en-row"><span class="en-name">${esc(p.en)}</span>${canSpeak ? '<button class="say" id="say" aria-label="اسمع اللفظ بالإنجليزي"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>اسمع</button>' : ''}</div>
    </div>
    <div class="where"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>${esc(p.w)}</span></div>
    <div class="blk"><h3>شو وظيفتها؟</h3><p>${esc(p.fn)}</p></div>
    <div class="blk"><h3>إذا خربت؟</h3><p>${esc(p.br)}</p></div>
    <div class="sev" style="--sev-c: var(${sv.v})"><span class="meter" aria-hidden="true">${[1, 2, 3].map(i => `<i class="${i <= p.sev ? 'on' : ''}"></i>`).join('')}</span><div><b>خطورة العطل: ${sv.t}</b><br><span>${sv.d}</span></div></div>
    ${p.note ? `<div class="note"><b>معلومة:</b> ${esc(p.note)}</div>` : ''}
    <div class="card-actions">
      <button class="btn" id="focusBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>قرّب عليها</button>
      <button class="btn" id="isoBtn" aria-pressed="${state.isolate}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M3 12h3M18 12h3M12 3v3M12 18v3"/></svg>اعزلها</button>
      <span class="grow"><button class="btn" id="prevBtn" aria-label="القطعة السابقة">→</button><button class="btn" id="nextBtn" aria-label="القطعة التالية">←</button></span>
    </div>`;
  $('#focusBtn').onclick = () => focusOn(p);
  $('#isoBtn').onclick = () => { state.isolate = !state.isolate; refreshLook(); renderCard(); };
  $('#prevBtn').onclick = () => step(-1);
  $('#nextBtn').onclick = () => step(1);
  $('#cardClose').onclick = () => { cardEl.classList.toggle('collapsed'); renderCard(); };
  requestAnimationFrame(updateOffset);
  const say = $('#say');
  if (say) say.onclick = () => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(p.en.replace(/\(.*?\)/g, '')); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch (e) { /* speech not available */ } };
}
function step(d) { const i = PARTS.indexOf(state.sel); select(PARTS[(i + d + PARTS.length) % PARTS.length], { focus: true }); }
function select(part, { focus = false } = {}) {
  state.sel = part;
  if (!part) state.isolate = false;
  refreshLook(); renderCard();
  listEl.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === part?.id)));
  const cur = listEl.querySelector(`[data-id="${part?.id}"]`); if (cur) cur.scrollIntoView({ block: 'nearest' });
  if (part && focus) focusOn(part);
  if (part && part.panel && state.mode === 'hidden') setMode('xray');
}
listEl.addEventListener('click', e => {
  const b = e.target.closest('.item'); if (!b) return;
  cardEl.classList.remove('collapsed');
  select(BY[b.dataset.id], { focus: true });
  if (matchMedia('(max-width: 860px)').matches) toggleIndex(false);
});
qEl.addEventListener('input', renderList);
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); refreshLook(); }));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => flyTo(...viewPos(b.dataset.view))));
const runBtn = $('#runBtn');
runBtn.addEventListener('click', () => {
  state.running = !state.running; runBtn.setAttribute('aria-pressed', String(state.running));
  runBtn.querySelector('span').textContent = state.running ? 'وقّف المحرك' : 'شغّل المحرك';
  runBtn.querySelector('svg').innerHTML = state.running ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
});
function toggleIndex(open) { indexEl.classList.toggle('open', open); $('#listToggle').setAttribute('aria-expanded', String(open)); }
$('#listToggle').addEventListener('click', () => toggleIndex(!indexEl.classList.contains('open')));
document.addEventListener('keydown', e => {
  if (e.target === qEl) return;
  if (e.key === 'Escape') select(null);
  if (state.sel && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.altKey) { e.preventDefault(); step(e.key === 'ArrowLeft' ? 1 : -1); }
});

/* pointer: click vs drag, hover tooltip */
let down = null, hoverXY = null, hintGone = false;
canvas.addEventListener('pointerdown', e => { if (indexEl.classList.contains('open')) toggleIndex(false); down = { x: e.clientX, y: e.clientY, t: performance.now() }; tween = null; if (!hintGone) { hintGone = true; $('#hint').style.opacity = '0.55'; } });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved > 6 || dt > 600) return;
  const p = pickAt(e.clientX, e.clientY);
  if (p) cardEl.classList.remove('collapsed');
  select(p);
});
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && !down) hoverXY = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerleave', () => { hoverXY = null; setHover(null); });
function setHover(p, x, y) {
  if (p !== state.hover) { state.hover = p; refreshLook(); canvas.style.cursor = p ? 'pointer' : ''; }
  if (p) { tipEl.innerHTML = `${esc(p.ar)}<span class="en">${esc(p.en)}</span>`; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.style.opacity = '1'; }
  else tipEl.style.opacity = '0';
}

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height);
  updateOffset();
}
// keep the car centred in the free area between the floating panels
function updateOffset() {
  const r = canvas.getBoundingClientRect();
  let dx = 0, dy = 0;
  if (r.width > 860) {
    const L = cardEl.hidden ? 16 : cardEl.getBoundingClientRect().right, R = indexEl.getBoundingClientRect().left;
    if (R > L) dx = (L + R) / 2 - r.width / 2;
  } else {
    const T = document.querySelector('.bar').getBoundingClientRect().bottom, B = cardEl.hidden ? r.height : cardEl.getBoundingClientRect().top;
    if (B > T) dy = (T + B) / 2 - r.height / 2;
  }
  if (dx || dy) camera.setViewOffset(r.width, r.height, -dx, -dy, r.width, r.height); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement); resize();
const clock = new THREE.Clock();
let frame = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05); frame++;
  if (tween) {
    tween.t = Math.min(1, (performance.now() - tween.start) / 750); const k = tween.t < 0.5 ? 2 * tween.t * tween.t : 1 - Math.pow(-2 * tween.t + 2, 2) / 2;
    controls.target.lerpVectors(tween.t0, tween.t1, k); camera.position.lerpVectors(tween.p0, tween.p1, k);
    if (tween.t >= 1) tween = null;
  }
  controls.update();
  if (state.running) {
    theta += dt * 9; engineUpdate(theta);
    if (ANIM.fan) ANIM.fan.rotation.x += dt * 14;
    ANIM.spinners.forEach(g => g.rotation.z -= dt * 5);
  }
  if (state.sel && !reduceMotion) {
    const k = Math.sin(performance.now() / 260) ** 2;
    selBox.material.opacity = 0.55 + 0.4 * k;
    state.sel.mats.forEach(m => m.emissiveIntensity = Math.max(m.userData.b.ei, 0.22 + 0.33 * k));
  }
  if (hoverXY && frame % 2 === 0) { const [x, y] = hoverXY; hoverXY = null; setHover(pickAt(x, y), x, y); }
  ground.visible = camera.position.y > 0.05;
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

/* boot */
renderList();
setMode('xray');
const fromHash = BY[decodeURIComponent(location.hash.slice(1))];
if (matchMedia('(max-width: 860px)').matches) cardEl.classList.add('collapsed');
select(fromHash || BY.engineBlock, { focus: !!fromHash });
if (!fromHash) { const [t, p] = viewPos('iso'); controls.target.copy(t); camera.position.copy(p); controls.update(); }
loop();
window.__carReady = true;
const ld = $('#loader'); ld.style.opacity = '0'; setTimeout(() => ld.hidden = true, 450);
window.__car = { PARTS, BY, select, setMode, camera, controls, pickAt };
</script>

</body>
</html>
