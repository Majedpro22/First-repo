<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تشريح السيارة 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: full-bleed 3D stage; parts index docked at the start (right, RTL), spec card floating at the end; both become sheets on phones. */
:root {
  --bg: #E4E9EE;
  --panel: rgba(248, 250, 252, 0.92);
  --panel-solid: #F6F8FA;
  --ink: #0F1A24;
  --ink-2: #4A5A6A;
  --line: #C6D0DA;
  --chip: #E2E8EE;
  --accent: #C9450F;
  --accent-ink: #FFFFFF;
  --demo-bg: #FFF1E9;
  --demo-line: #F3C7AF;
  --grid: #8E9BA8;
  --xray: #2F6CC9;
  --sky-top: #F7F9FB;
  --sky-bottom: #CFD8E1;
  --sev1: #2C8653;
  --sev2: #A86F12;
  --sev3: #C2302F;
  --shadow: 0 10px 30px rgba(15, 26, 36, 0.12);
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #091017; --panel: rgba(15, 23, 31, 0.92); --panel-solid: #0F171F;
    --ink: #E4ECF2; --ink-2: #93A5B6; --line: #233343; --chip: #182533;
    --accent: #FF7B3F; --accent-ink: #1C0C03; --demo-bg: #26170F; --demo-line: #5A3220;
    --grid: #2C3D4D; --xray: #7DB0FF; --sky-top: #1A2836; --sky-bottom: #070B10;
    --sev1: #4CC27E; --sev2: #E9B33C; --sev3: #FF6666; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #091017; --panel: rgba(15, 23, 31, 0.92); --panel-solid: #0F171F;
  --ink: #E4ECF2; --ink-2: #93A5B6; --line: #233343; --chip: #182533;
  --accent: #FF7B3F; --accent-ink: #1C0C03; --demo-bg: #26170F; --demo-line: #5A3220;
  --grid: #2C3D4D; --xray: #7DB0FF; --sky-top: #1A2836; --sky-bottom: #070B10;
  --sev1: #4CC27E; --sev2: #E9B33C; --sev3: #FF6666; --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#stage { position: absolute; inset: 0; background: var(--bg); }
#c { display: block; width: 100%; height: 100%; touch-action: none; }

/* The overlay never takes clicks itself; only the real panels do, so the car stays clickable. */
#ui {
  position: absolute; inset: 0; pointer-events: none; z-index: 6;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 370px; gap: 12px; min-height: 0; }
#ui .bar, #index, #card, .foot > *, #sim { pointer-events: auto; }

.surface { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 12px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-inline-end: auto; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 0; color: var(--ink-2); font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel-solid); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel-solid); padding: 5px 11px; border-radius: 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn svg { width: 15px; height: 15px; flex: none; }
#listToggle { display: none; }

/* parts index */
#index { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.index-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.index-head h2 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
.index-head h2 small { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); font-weight: 400; }
#q { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; font-size: 14px; }
#q::placeholder { color: var(--ink-2); }
#list { overflow-y: auto; padding: 0 6px 12px; min-height: 0; overscroll-behavior: contain; }
.grp { margin-top: 6px; }
.grp-h { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--panel-solid); letter-spacing: .04em; }
.grp-h .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.grp-h .en { font-family: var(--font-mono); font-weight: 400; margin-inline-start: auto; font-size: 11px; text-transform: uppercase; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; width: 100%; text-align: start; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.item[aria-current="true"] .en { color: inherit; opacity: .85; }
.item .ar { font-size: 14px; overflow-wrap: anywhere; }
.item .en { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); direction: ltr; text-align: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
.empty { padding: 16px 10px; color: var(--ink-2); font-size: 13px; }
.more { margin: 14px 8px 4px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
.more b { color: var(--ink); font-weight: 600; }
.more a { color: var(--accent); text-decoration: none; }
.more a:hover { text-decoration: underline; }

/* spec card */
#card { grid-column: 3; align-self: start; max-height: 100%; overflow-y: auto; padding: 16px; display: grid; gap: 12px; overscroll-behavior: contain; }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sys-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--chip); color: var(--ink); }
.sys-chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.code { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); direction: ltr; }
#cardClose { margin-inline-start: auto; border: 0; background: transparent; padding: 2px 6px; font-size: 18px; line-height: 1; color: var(--ink-2); display: none; }
.name h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.25; text-wrap: balance; }
.en-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.en-name { font-family: var(--font-mono); font-size: 14px; direction: ltr; color: var(--ink); background: var(--chip); padding: 2px 8px; border-radius: 6px; }
.say { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 3px 7px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); }
.say svg { width: 14px; height: 14px; }
.demo { background: var(--demo-bg); border: 1px solid var(--demo-line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.demo-h { display: flex; align-items: center; gap: 8px; }
.demo-h b { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.demo-h b i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.demo.playing .demo-h b i { animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.demo-h .btn { margin-inline-start: auto; padding: 3px 10px; font-size: 12px; }
.demo p { margin: 0; font-size: 14px; }
.demo p b { color: var(--accent); font-family: var(--font-mono); }
.keys { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-2); }
.keys span { display: inline-flex; align-items: center; gap: 5px; }
.keys i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.where { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: flex-start; }
.where svg { width: 14px; height: 14px; flex: none; margin-top: 4px; }
.blk { display: grid; gap: 4px; }
.blk h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: .04em; }
.blk p { margin: 0; font-size: 15px; }
.sev { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); border-inline-start: 4px solid var(--sev-c, var(--line)); }
.sev b { font-size: 14px; color: var(--sev-c); }
.sev span { font-size: 13px; color: var(--ink-2); }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--sev-c); }
.note { font-size: 13.5px; background: var(--chip); border-radius: 10px; padding: 9px 12px; }
.note b { font-weight: 600; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.card-actions .grow { margin-inline-start: auto; display: inline-flex; gap: 6px; }

/* footer hint, tooltip, callout, loader */
.foot { justify-self: center; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.hint { font-size: 12.5px; color: var(--ink-2); padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.legend { display: inline-flex; gap: 10px; font-size: 12px; color: var(--ink-2); padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); flex-wrap: wrap; justify-content: center; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
#tip { position: fixed; z-index: 30; pointer-events: none; padding: 5px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); opacity: 0; transition: opacity .12s; }
#tip .en { font-family: var(--font-mono); font-size: 11px; opacity: .75; margin-inline-start: 6px; }
#callout { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, calc(-100% - 12px)); background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 600; font-size: 13px; padding: 4px 11px; border-radius: 99px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
#callout::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 12px; background: var(--accent); transform: translateX(-50%); }
#loader { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 40; transition: opacity .4s; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#loader p { margin: 8px 0 0; color: var(--ink-2); font-size: 14px; }
#loader .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); margin: 0 auto; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }


/* engine teardown stepper, driving HUD, fault box, exploded-view labels */
.center { display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 0; }
#sim { width: min(560px, 100%); padding: 10px 12px; display: grid; gap: 8px; }
.sim-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sim-head b { font-family: var(--font-display); font-size: 14px; margin-inline-end: auto; }
.sim-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.gauge { display: grid; line-height: 1.15; text-align: center; min-width: 52px; }
.gauge b { font-family: var(--font-mono); font-size: 21px; font-weight: 500; }
.gauge small { font-size: 11px; color: var(--ink-2); font-family: var(--font-mono); }
.temp { display: grid; gap: 4px; flex: 1; min-width: 110px; font-size: 11.5px; color: var(--ink-2); }
.temp span { display: block; height: 6px; border-radius: 3px; position: relative; direction: ltr; background: linear-gradient(90deg, #2E9BFF, #4CC27E 40%, #E9B33C 72%, #FF4A3D); }
.temp span i { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); left: 45%; transition: left .25s; }
.lamps { display: flex; gap: 4px 6px; flex-wrap: wrap; }
.lamp { width: 26px; height: 26px; padding: 2px; border-radius: 6px; color: var(--ink-2); opacity: .28; box-sizing: border-box; }
.lamp svg { width: 100%; height: 100%; display: block; }
.lamp.on { opacity: 1; background: rgba(0, 0, 0, .55); }
.lamp.on.r { color: #FF4136; } .lamp.on.a { color: #FFB000; }
.lamp.on.blink { animation: blink .55s steps(2, jump-none) infinite; }
.sim-msg { margin: 0; font-size: 14px; font-weight: 600; color: var(--sev3); min-height: 1.4em; }
.snd-note { margin: 0; font-size: 11.5px; color: var(--ink-2); }
#td { width: min(640px, calc(100vw - 32px)); padding: 10px 12px; display: grid; gap: 8px; box-sizing: border-box; }
.td-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.td-h b { font-family: var(--font-display); font-size: 14px; }
.td-h .num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.td-h .nm { color: var(--accent); font-weight: 600; font-size: 14px; }
.td-bar { height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
.td-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s; }
.td-ctrl { display: flex; gap: 6px; flex-wrap: wrap; }
.td-ctrl .btn { padding: 4px 10px; font-size: 12.5px; }
.td-ctrl .btn:disabled { opacity: .4; cursor: default; }
.td-ctrl .x { margin-inline-start: auto; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.tdl { position: absolute; left: 0; top: 0; pointer-events: auto; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 11.5px; line-height: 1.3; padding: 2px 8px; border-radius: 99px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, .12); will-change: transform; }
.tdl:hover { border-color: var(--accent); color: var(--accent); }
.fault { border: 1px solid var(--line); border-inline-start: 4px solid var(--sev3); border-radius: 12px; padding: 10px 12px; display: grid; gap: 8px; }
.fault.on { background: var(--demo-bg); }
.fault-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fault-h b { font-size: 13px; font-weight: 600; }
.fault-h .btn { margin-inline-start: auto; padding: 3px 10px; font-size: 12px; }
.sym { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: 14px; }
.sym li { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.sym li i { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--chip); border-radius: 6px; padding: 1px 4px; text-align: center; }
.dx { margin: 0; font-size: 13.5px; }
.dx b { color: var(--accent); font-weight: 600; }
@media (max-width: 1500px) { .brand p { display: none; } }
@media (max-width: 860px) { .lamp:not(.on) { display: none; } .lamps:not(:has(.on)) { display: none; } }
@media (max-width: 520px) { .seg[aria-label="زاوية الكاميرا"] { display: none; } #colorBtn span, #sndBtn span { display: none; } }
@media (max-width: 1100px) {
  .main { grid-template-columns: 260px minmax(0, 1fr) 330px; }
}
@media (max-width: 860px) {
  #ui { gap: 8px; padding-block: 8px; }
  #sim { padding: 8px 10px; gap: 6px; }
  #sim .snd-note { display: none; }
  .lamp { width: 22px; height: 22px; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #listToggle { display: inline-flex; }
  #index { position: absolute; z-index: 25; top: 8px; bottom: 8px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(340px, calc(100% - 32px)); transform: translateX(calc(100% + 40px)); transition: transform .25s ease; }
  #index.open { transform: none; }
  #card { grid-column: 1; grid-row: 2; align-self: end; max-height: 50vh; padding: 12px 14px; gap: 10px; }
  #card.collapsed > :not(.card-top):not(.name):not(.demo) { display: none; }
  #card.collapsed .en-row, #card.collapsed .keys { display: none; }
  #card.collapsed .name h2 { font-size: 18px; }
  #cardClose { display: inline-block; }
  .name h2 { font-size: 21px; }
  .brand h1 { font-size: 17px; }
  .brand p { display: none; }
  .legend { display: none; }
  .hint { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #index, #tip, #loader, .td-bar i, .temp span i { transition: none; }
  .lamp.on.blink { animation: none; }
  #loader .spin, .demo.playing .demo-h b i { animation: none; }
}
</style>

<div id="app" dir="rtl" lang="ar">
  <div id="stage"><canvas id="c" aria-label="مجسم سيارة ثلاثي الأبعاد. اسحب لتلف السيارة واكبس على أي قطعة لتشوف كيف بتشتغل."></canvas></div>
  <div id="callout" hidden></div>
  <div id="labels" aria-hidden="true" hidden></div>

  <div id="ui">
    <header class="bar surface">
      <div class="brand">
        <h1>تشريح <span>السيارة</span></h1>
        <p>سيدان على طراز BMW · اكبس على أي قطعة لتشوف كيف بتشتغل</p>
      </div>
      <div class="controls">
        <button class="btn" id="listToggle" aria-expanded="false" aria-controls="index">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          القطع
        </button>
        <div class="seg" role="group" aria-label="شكل الهيكل">
          <button data-mode="xray" aria-pressed="true">شفّاف</button>
          <button data-mode="solid" aria-pressed="false">كامل</button>
          <button data-mode="hidden" aria-pressed="false">بدون هيكل</button>
        </div>
        <button class="btn" id="runBtn" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span>شغّل المحرك</span>
        </button>
        <button class="btn" id="driveBtn" aria-pressed="false" title="السيارة بتمشي عالطريق">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 15l1.6-5A2 2 0 0 1 8.5 8.6h7a2 2 0 0 1 1.9 1.4L19 15M3.5 15h17v3.5h-17zM7 18.5V20M17 18.5V20"/></svg>
          <span>سوق</span>
        </button>
        <button class="btn" id="tdBtn" aria-pressed="false" title="فكّ المحرك قطعة قطعة">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>

def({ id: 'crankshaft', sys: 'engine', demo: 'crank', ar: 'عمود الكرنك', en: 'Crankshaft', sev: 3,
  w: 'أسفل البلوك، بطول المحرك',
  fn: 'بيحوّل حركة البساتم (طلوع ونزول) لدوران. هاد الدوران هو اللي بيوصل للعجلات بالآخر.',
  br: 'إذا تآكلت السبيكة (Bearings) بتسمع دقّة قوية من تحت المحرك وبينزل ضغط الزيت. لازم توقّف فوراً.',
  build(h) {
    const g = h.group({ p: [0, CY, 0] }); RIG.crank = g;
    const m = h.mat({ color: '#C9CED6', metal: 0.85, rough: 0.3 });
    h.mesh(cylX(0.022, 0.022, 0.70), { mat: m, p: [1.28, 0, 0], parent: g });
    CYLX.forEach((x, i) => {

      [-0.03, 0.03].forEach(dx => h.mesh(box(0.012, 0.09, 0.055), { p: [x + dx, 0.012 * c, 0.012 * s], r: [a, 0, 0], parent: g }));
    });
  } });

def({ id: 'crankBearings', sys: 'engine', demo: 'bearings', ar: 'السبيكة وكراسي الكرنك', en: 'Main Bearings & Caps', sev: 3,

  fn: 'أنصاص حلقات من معدن طري (لونها دهبي) حوالين الكرنك، والكراسي الحديد بتشدّها عالبلوك. الكرنك ما بيلمسها مباشرة: بيدور على طبقة زيت بالضغط.',

def({ id: 'camshaft', sys: 'engine', demo: 'valvetrain', ar: 'عمود الكامات (الكامة)', en: 'Camshafts', sev: 2,

  fn: 'بيلف وبيفتح ويسكّر الصبابات بالوقت المظبوط. بيلف بنص سرعة الكرنك. هون في كامتين: وحدة للسحب ووحدة للعادم.',

  build(h) {
    const m = h.mat({ color: '#D9DEE4', metal: 0.85, rough: 0.3 });
    [-0.055, 0.055].forEach((z, k) => {
      const g = h.group({ p: [0, 0.752, z] }); RIG.cams.push(g);
      h.mesh(cylX(0.011, 0.011, 0.58), { mat: m, p: [1.29, 0, 0], parent: g });
      CYLX.forEach((x, i) => [-0.022, 0.022].forEach(dx => {

      }));

  } });

def({ id: 'valves', sys: 'engine', demo: 'valvetrain', ar: 'الصبابات (البلوف)', en: 'Intake & Exhaust Valves', sev: 3,
  w: 'براس المحرك، 4 فوق كل سلندر',
  fn: 'بوابات صغيرة: صبابات السحب بتدخّل الهوا، وصبابات العادم بتطلّع الغاز المحروق.',
  br: 'إذا احترقت أو ما عادت تسكّر منيح المحرك بيضعف وبيرجف (Misfire). بأغلب المحركات الحديثة إذا انقطع جنزير التوقيت البساتم بتضرب بالصبابات وبتعوّجها.',
  build(h) {
    const mi = h.mat({ color: '#9FD3FF', metal: 0.7, rough: 0.3 }), me = h.mat({ color: '#FFB08A', metal: 0.7, rough: 0.3 });
    CYLX.forEach((x, i) => [-1, 1].forEach(side => [-0.022, 0.022].forEach(dx => {
      const al = side * 0.2, g = h.group({ p: [x + dx, 0.645, side * 0.03], r: [al, 0, 0] });
      const m = side > 0 ? me : mi;
      h.mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.075, 8), { mat: m, p: [0, 0.037, 0], parent: g });
      h.mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.004, 16), { mat: m, parent: g });
      RIG.valves.push({ g, i, ex: side > 0, base: g.position.clone(), dir: new THREE.Vector3(0, -Math.cos(al), -Math.sin(al)), lift: 0 });
    })));
  } });

def({ id: 'valveSprings', sys: 'engine', demo: 'springs', ar: 'نوابض الصبابات (يايات البلوف)', en: 'Valve Springs & Retainers', sev: 2,
  w: 'براس المحرك، حوالين ساق كل صبابة',
  fn: 'نابض صغير قوي حوالين كل صبابة: الكامة بتدفش الصبابة لتفتح، والنابض بيرجّعها تسكّر بسرعة وبيضل ضاغطها على مقعدها.',
  br: 'إذا ضعف أو انكسر: الصبابة ما بتسكّر بوقتها، تكتكة، رجفة (Misfire) خصوصاً عالدورات العالية، وممكن البستم يضرب فيها.',
  build(h) {
    const sm = h.mat({ metal: 0.7, rough: 0.35 }), rm = h.mat({ color: '#B9BFC7', metal: 0.85, rough: 0.3 }), pts = [];
    for (let i = 0; i <= 70; i++) { const t = i / 70, a = t * 5 * Math.PI * 2; pts.push(new THREE.Vector3(0.0078 * Math.cos(a), t * VSL, 0.0078 * Math.sin(a))); }
    const geo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 70, 0.0012, 5), ret = new THREE.CylinderGeometry(0.0095, 0.0095, 0.003, 16);
    RIG.valves.forEach(v => {
      const g = h.group({ p: v.base.toArray(), r: [v.g.rotation.x, 0, 0] });
      RIG.vsprings.push({ v, s: h.mesh(geo, { mat: sm, p: [0, VSB, 0], parent: g }), r: h.mesh(ret, { mat: rm, p: [0, VSB + VSL, 0], parent: g }) });
    });
  } });

  w: 'ورا المحرك بهالموديل (مكانه بيختلف حسب المحرك)',

def({ id: 'shocks', sys: 'suspension', demo: 'bounce', ar: 'المساعدات (الأمورتيسير)', en: 'Shock Absorbers (Dampers)', sev: 2,
  w: 'عند كل عجلة',
  fn: 'بتهدّي حركة النطّ: بعد المطب السبرينغ بيضل ينطّ، والمساعد بيوقّفه.',
  br: 'السيارة بتنطّ كتير بعد المطبات، بتميل باللفّات، مسافة الفرملة بتطول، وممكن تشوف زيت عالمساعد.',
  build(h) {
    const b = h.mat({}), r = h.mat({ color: '#D2D6DC', metal: 0.9, rough: 0.2 }), boot = h.mat({ color: '#17181A', rough: 0.8 });
    const bellows = len => { const pts = []; for (let i = 0; i <= 16; i++) pts.push(new THREE.Vector2(i % 2 ? 0.024 : 0.018, i / 16 * len)); return new THREE.LatheGeometry(pts, 24); };
    [-1, 1].forEach(s => {
      [[FA, 0.36, 0.66, 0.62, 0.62, 0.80, 0.60, s < 0 ? 'FL' : 'FR', 0.028, true], [RA - 0.22, 0.24, 0.66, 0.50, 0.64, 0.63, 0.63, s < 0 ? 'RL' : 'RR', 0.026, false]].forEach(([x, y0, z0, y1, z1, y2, z2, k, rad, front]) => {
        const g = h.group({ p: [x, y0, s * z0] }); RIG.keepStatic.add(g);
        h.mesh(rod([0, 0, 0], [0, y1 - y0, s * (z1 - z0)], rad, 24), { mat: b, parent: g });
        h.mesh(new THREE.TorusGeometry(rad + 0.004, 0.004, 8, 24), { mat: b, p: [0, y1 - y0 - 0.005, s * (z1 - z0)], r: [Math.PI / 2, 0, 0], parent: g });
        RIG.shocks.push({ g, k, y: y0 });
        h.mesh(rod([x, y1, s * z1], [x, y2, s * z2], 0.011, 14), { mat: r });
        if (front) { const bl = h.mesh(bellows(0.11), { mat: boot, p: [x, y1 + 0.015, s * (z1 - 0.004)] }); bl.rotation.x = -s * 0.15; }
      });
    });
  } });

def({ id: 'wipers', sys: 'electrical', demo: 'wipers', ar: 'المسّاحات', en: 'Windshield Wipers', sev: 1,
  w: 'أسفل الزجاج القدّامي',
  fn: 'بتمسح المطر والوسخ عن الزجاج القدّامي، ومعها بخّاخ ماي.',
  br: 'إذا صارت تخطّط أو تزقزق: الشفرات الكاوتشوك ناشفة. غيّرها، رخيصة.',
  build(h) {
    const m = h.mat({ color: '#20242A', rough: 0.6 });
    [[-0.50, 0.08], [0.06, 0.62]].forEach(([z0, z1]) => {
      const pts = [];
      for (let i = 0; i <= 8; i++) { const t = i / 8, x = 1.035 - 0.07 * t, z = z0 + (z1 - z0) * t; pts.push([x, surfY(x, z) + 0.014, z]); }
      const P0 = new THREE.Vector3(...pts[0]), g = h.group({ p: pts[0] });
      const geo = tube(pts, 0.007, 30); geo.translate(-P0.x, -P0.y, -P0.z);
      h.mesh(geo, { mat: m, parent: g });
      const dy = (surfY(1.0, z0) - surfY(1.05, z0)) / 0.05, dz = (surfY(1.035, z0 + 0.03) - surfY(1.035, z0)) / 0.03;
      const n = new THREE.Vector3(dy, 1, -dz).normalize(), tip = new THREE.Vector3(...pts[8]).sub(P0);
      const sign = tip.clone().applyAxisAngle(n, 0.3).x < tip.x ? 1 : -1;
      RIG.wipers.push({ g, n, sign });
    });
  } });

/* ------------------------------------------------------------------ *
 *  Geometry helpers
 * ------------------------------------------------------------------ */
function box(w, h, d) { return new THREE.BoxGeometry(w, h, d); }
function rbox(w, h, d, r = 0.02) { return new RoundedBoxGeometry(w, h, d, 3, Math.max(0.001, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001))); }
function cylX(r1, r2, len, seg = 24, open = false) { const g = new THREE.CylinderGeometry(r1, r2, len, seg, 1, open); g.rotateZ(-Math.PI / 2); return g; }
function cylZ(r1, r2, len, seg = 24, open = false) { const g = new THREE.CylinderGeometry(r1, r2, len, seg, 1, open); g.rotateX(Math.PI / 2); return g; }
function tube(pts, r, seg = 48, closed = false) {
  const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p)), closed, 'centripetal');
  return new THREE.TubeGeometry(c, seg, r, 8, closed);
}
function rod(a, b, r, seg = 12) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  g.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize()));
  const m = A.add(B).multiplyScalar(0.5); g.translate(m.x, m.y, m.z); return g;
}
function helix(a, b, rad, turns, r) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), ax = B.clone().sub(A).normalize();
  const u = new THREE.Vector3(1, 0, 0).cross(ax).normalize(), v = ax.clone().cross(u).normalize(), pts = [];
  for (let i = 0; i <= turns * 24; i++) {
    const t = i / (turns * 24), ang = t * turns * Math.PI * 2;
    pts.push(A.clone().lerp(B, t).add(u.clone().multiplyScalar(Math.cos(ang) * rad)).add(v.clone().multiplyScalar(Math.sin(ang) * rad)));
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), turns * 40, r, 8, false);
}
function coil(a, b, rad, turns, r) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), ax = B.clone().sub(A), len = ax.length(); ax.normalize();
  const u = new THREE.Vector3(1, 0, 0).cross(ax).normalize(), v = ax.clone().cross(u).normalize(), pts = [], n = turns * 32, close = 0.85, pc = r * 2.3;
  const hAt = t => { const k = t * turns; if (k < close) return k * pc; if (k > turns - close) return len - (turns - k) * pc; return close * pc + (k - close) / (turns - 2 * close) * (len - 2 * close * pc); };
  for (let i = 0; i <= n; i++) { const t = i / n, ang = t * turns * Math.PI * 2; pts.push(A.clone().addScaledVector(ax, hAt(t)).addScaledVector(u, Math.cos(ang) * rad).addScaledVector(v, Math.sin(ang) * rad)); }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), turns * 48, r, 10, false);
}
function roundRect(w, hgt, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -hgt / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + hgt - r);
  s.quadraticCurveTo(x + w, y + hgt, x + w - r, y + hgt); s.lineTo(x + r, y + hgt); s.quadraticCurveTo(x, y + hgt, x, y + hgt - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}
// pulley with spokes so its turning is visible; ratio = turns per crank turn
function pulley(h, mat, p, r, ratio) {
  const g = h.group({ p }); RIG.pulleys.push({ g, ratio });
  h.mesh(cylX(r, r, 0.03, 32), { mat, parent: g });
  const dark = h.mat({ color: '#2B3036' });
  for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; h.mesh(box(0.034, r * 0.9, 0.008), { mat: dark, p: [0.003, Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45], r: [a, 0, 0], parent: g }); }
}
// small bladed wheel (turbo compressor / turbine)
function bladeWheel(h, mat, p, r, n) {
  const g = h.group({ p });
  h.mesh(cylX(0.012, 0.012, 0.04, 12), { mat, parent: g });
  for (let i = 0; i < n; i++) { const bg = new THREE.Group(); bg.rotation.x = i / n * Math.PI * 2; g.add(bg); h.mesh(box(0.03, r, 0.004), { mat, p: [0, r / 2, 0], r: [0, 0.6, 0], parent: bg }); }
  return g;
}
function sector(r0, r1, a0, a1) { const sh = new THREE.Shape(); sh.absarc(0, 0, r1, a0, a1, false); sh.absarc(0, 0, r0, a1, a0, true); sh.closePath(); return sh; }
function ext(shape, depth, bevel = 0.004) {
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2, curveSegments: 28 });
  g.translate(0, 0, -depth / 2); return g;
}
function poly(pts) { const sh = new THREE.Shape(); sh.moveTo(...pts[0]); pts.slice(1).forEach(p => sh.lineTo(...p)); sh.closePath(); return sh; }
function capsule(a, b, r) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b), len = A.distanceTo(B);

  const m = A.add(B).multiplyScalar(0.5); g.translate(m.x, m.y, m.z); return g;
}

function tireTex() {

  const both = f => [[m, '#0c0c0d'], [b, '#151515']].forEach(([c, col]) => { c.fillStyle = col; c.strokeStyle = col; f(c); });

/* SYNTH:BEGIN */
// Engine and fault sounds, generated sample by sample (no recordings). P holds the live parameters.
function makeSynth(SR, P) {
  let seed = 0x2545F491;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; };
  const nz = () => rnd() * 2 - 1;
  const TAU = Math.PI * 2;
  // a decaying resonator: hit() rings it like a struck object, drive() lets noise through it like a filter
  class Ring {
    constructor(f, tau) { this.re = 0; this.im = 0; this.set(f, tau); }
    set(f, tau) { const r = Math.exp(-1 / (tau * SR)), w = TAU * f / SR; this.cr = r * Math.cos(w); this.ci = r * Math.sin(w); this.n = Math.sqrt(1 - r * r); return this; }
    hit(a) { this.re += a; }
    drive(x) { this.re += x * this.n; }
    tick() { const re = this.re * this.cr - this.im * this.ci; this.im = this.re * this.ci + this.im * this.cr; this.re = re; return this.im; }
  }
  const R = {
    eLow: new Ring(74, 0.012), eMid: new Ring(190, 0.006), eHi: new Ring(1150, 0.0035), eBody: new Ring(52, 0.017),
    kL: new Ring(250, 0.02), kM: new Ring(1750, 0.006), mL: new Ring(125, 0.032), mM: new Ring(820, 0.009), sl: new Ring(420, 0.012),
    tA: new Ring(3600, 0.0024), tB: new Ring(2350, 0.0035), rr: new Ring(2600, 0.002), pg: new Ring(5200, 0.0016),
    pop: new Ring(140, 0.025), popN: new Ring(700, 0.006), hum: new Ring(90, 0.05), g1: new Ring(1350, 0.0025), g2: new Ring(2950, 0.003),
    scr: new Ring(2650, 0.003), wh: new Ring(950, 0.004), c1: new Ring(85, 0.05), c2: new Ring(430, 0.014), cv1: new Ring(2100, 0.003),
    cv2: new Ring(720, 0.006), th: new Ring(50, 0.06), thN: new Ring(260, 0.01), bc1: new Ring(1500, 0.004), bc2: new Ring(520, 0.01),
    pf: new Ring(820, 0.005), ur: new Ring(1900, 0.003), rs: new Ring(3400, 0.0012), ch1: new Ring(1100, 0.32), ch2: new Ring(1650, 0.24),
    bl: new Ring(260, 0.01), fan: new Ring(330, 0.012), wnd: new Ring(1200, 0.012), st1: new Ring(2500, 0.002), st2: new Ring(600, 0.006),
    road: new Ring(380, 0.006), sh1: new Ring(70, 0.05),
  };
  const RINGS = Object.values(R);
  const S = { rpm: 0, load: 0, v: 0, brake: 0, steer: 0, eng: 0, crank: 0, vol: 0, boost: 0, horn: 0, t: 0, ph: 0, cyl: 0, cph: 0, half: false, wph: 0,
    nEnv: 0, pfEnv: 0, popQ: -1, pn: 0, thE: 0, lp: 0, hp: 0, sq: 0, wn: 0, pw: 0, bs: 0, sp: 0, tw: 0, bz: 0, bzl: 0, bp: 0, bp2: 0, pd: 0, dp: 0, mp: 0, wp: 0,
    stp: 0, pr: 0, h1: 0, h2: 0, duck: 1, chT: 0, clk: 0, creak: 0, cr: 0, rsB: 0, primeT: 0, f: {}, bump: 0, shift: 0, jolt: 0, crankN: 0, primeN: 0 };
  const nd = Math.exp(-1 / (0.003 * SR)), nd2 = Math.exp(-1 / (0.02 * SR)), nd3 = Math.exp(-1 / (0.03 * SR));
  const b = 1 - Math.exp(-1 / (0.04 * SR)), bSlow = 1 - Math.exp(-1 / (0.18 * SR)), bBoost = 1 - Math.exp(-1 / (0.5 * SR));
  const WREV = 2.17;   // wheel turns per second at full (visual) speed, so thumps match what you see

  function render(out) {
    const n = out.length, a = 1 - Math.exp(-n / (0.08 * SR)), f = S.f, pf = P.f || {};
    for (const k in pf) f[k] = (f[k] || 0) + (pf[k] - (f[k] || 0)) * a;
    for (const k in f) if (!(k in pf)) { f[k] *= 1 - a; if (f[k] < 0.002) delete f[k]; }
    if (P.bump !== S.bump) { S.bump = P.bump; R.sh1.hit(0.22 * Math.min(1, S.v * 3)); if (f.clunk) { R.c1.hit(0.7 * f.clunk); R.c2.hit(0.3 * f.clunk); } if (f.creak) S.creak = 0.3; if (f.rattleS) S.rsB = 0.35; }
    if (P.shift !== S.shift) { S.shift = P.shift; if (f.shift) { R.c1.hit(0.6 * f.shift); R.c2.hit(0.35 * f.shift); } }
    if (P.jolt !== S.jolt) { S.jolt = P.jolt; if (f.jolt) { R.c1.hit(0.75 * f.jolt); R.c2.hit(0.3 * f.jolt); } }
    if (P.crankN !== S.crankN) { S.crankN = P.crankN; if (P.crankMode === 'single') { R.st1.hit(0.45); R.st2.hit(0.4); } }
    if (P.primeN !== S.primeN) { S.primeN = P.primeN; S.primeT = 1.6; }
    R.hum.set(70 + S.v * 110, 0.05);
    const volT = P.mute ? 0 : (P.vol ?? 1), crankMode = P.crankMode;
    let fl = 0; for (const k in f) if (k !== 'loud') fl = Math.max(fl, f[k]);
    const duckT = 1 - 0.35 * Math.min(1, fl);
    for (let i = 0; i < n; i++) {
      S.rpm += ((P.rpm || 0) - S.rpm) * b; S.load += ((P.load || 0) - S.load) * b; S.v += ((P.v || 0) - S.v) * b;
      S.brake += ((P.brake || 0) - S.brake) * b; S.steer += ((P.steer || 0) - S.steer) * b;
      S.eng += ((P.eng ? 1 : 0) - S.eng) * bSlow; S.crank += ((P.crank ? 1 : 0) - S.crank) * b; S.vol += (volT - S.vol) * b;
      S.boost += (S.load * S.eng - S.boost) * bBoost;
      const rpm = S.rpm;
      let y = 0;
      // crank and wheel turns: the beat for knocks, ticks and thumps
      S.cph += rpm / 60 / SR; let cw = false; if (S.cph >= 1) { S.cph -= 1; cw = true; S.half = !S.half; }
      const camw = cw && S.half;
      S.wph += S.v * WREV / SR; let ww = false; if (S.wph >= 1) { S.wph -= 1; ww = true; }
      // ---- the engine itself: one pressure pulse per firing (inline-6 = 3 per crank turn)
      const live = Math.max(S.eng, crankMode === 'click' || crankMode === 'single' ? 0 : S.crank);
      if (rpm > 40 && live > 0.003) {
        S.ph += rpm / 20 / SR;
        if (S.ph >= 1) {
          S.ph -= 1; S.cyl = (S.cyl + 1) % 6;
          let amp = (S.eng > 0.5 ? 0.55 + 0.45 * S.load : 0.32) * (1 + (rnd() - 0.5) * (0.1 + 0.7 * (P.rough || 0)));
          if (P.miss === S.cyl && rnd() < (P.missK || 0)) { amp *= 0.05; if (f.pop) S.popQ = Math.floor(SR * 0.03); }
          R.eLow.hit(amp); R.eMid.hit(amp * 0.6); R.eBody.hit(amp * 0.35); S.nEnv = amp;
          if (f.puff && S.cyl === 2) S.pfEnv = f.puff;
        }
        S.nEnv *= nd;
        R.eHi.drive(nz() * S.nEnv * 3);
        const loud = 1 + (f.loud || 0) * 0.9;
        const e = R.eLow.tick() * 0.9 + R.eMid.tick() * 0.45 * loud + R.eBody.tick() * 0.45 + R.eHi.tick() * (0.22 + 0.4 * (f.loud || 0));
        S.lp += (e - S.lp) * (0.06 + 0.12 * S.load + 0.08 * (f.loud || 0));
        S.duck += (duckT - S.duck) * 0.0005;
        y += S.lp * 0.9 * loud * live * S.duck;
      }
      // starter motor whine while cranking
      if (S.crank > 0.003 && crankMode !== 'click' && crankMode !== 'single') {
        S.stp += (1080 + 60 * Math.sin(S.t * 12)) / SR; if (S.stp > 1) S.stp -= 1;
        y += (Math.sin(TAU * S.stp) * 0.5 + Math.sin(2 * TAU * S.stp) * 0.25) * 0.05 * S.crank + nz() * 0.01 * S.crank;
      }
